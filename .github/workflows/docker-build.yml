name: Build & Push to container registry
on:
  workflow_call:
    inputs:
      TARGET_FILE:
        description: "Dockerfile to build"
        type: string
        required: false
        default: "Dockerfile"
      TARGET_IMAGE_NAME:
        description: "Docker image name"
        type: string
        required: false
        default: ""
      PLATFORMS:
        description: "Docker image platforms"
        type: string
        required: false
        default: "linux/amd64,linux/arm64/v8"
      RUNNER:
        description: "Runner to use"
        type: string
        required: false
        default: 'ubuntu-latest'

jobs:
  build:
    runs-on: ${{ inputs.RUNNER }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tags
        if: ${{ github.event_name == 'release' }}
        run: echo ::set-output name=name::${GITHUB_REF##*/}

      - name: Extract flavor
        id: flavor
        run: if [ "${{ github.event_name }}" = "release" ]; then echo ::set-output name=name::; else echo ::set-output name=name::-dev; fi
      
      - id: string
        uses: ASzc/change-string-case-action@d0603cd0a7dd490be678164909f65c7737470a7f # v6
        with:
          string: ${{ github.repository }}

      - name: Generate Docker image metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: img_meta
        with:
          flavor: |
            latest=auto
          images: "ghcr.io/${{ inputs.TARGET_IMAGE_NAME || steps.string.outputs.lowercase }}"
          tags: |
            type=ref,event=branch
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ steps.tags.outputs.name }},enable=${{ github.event_name == 'release' }}
    
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: ${{ inputs.TARGET_FILE }}
          context: ./
          platforms: ${{ inputs.PLATFORMS }}
          tags: ${{ steps.img_meta.outputs.tags }}
          labels: ${{ steps.img_meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          secrets: |
            GITHUB_SHA=${{ github.sha }}
            GH_PKG_TOKEN=${{ secrets.GH_TOKEN }}
          
